[project]
name = "gmail-calendar"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth>=2.63.1",
    "google-auth-httplib2>=0.4.4",
    "mcp>=1.9,<2",
